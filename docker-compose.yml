# Local run: docker compose up --build   then open http://localhost:8501 (dashboard) and http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mosje
      POSTGRES_PASSWORD: mosje
      POSTGRES_DB: mosje
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosje -d mosje"]
      interval: 5s
      retries: 20

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mosje:mosje@db:5432/mosje
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  pgdata:
